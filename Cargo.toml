[package]
name = "alocals3-rust"
version = "0.9.3"
edition = "2021"
authors = ["HfCloud(sxysxygm@gmail.com)"]

[lib]
name = "_alocals3_native"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "alocals3-server"
path = "src/bin/alocals3-server.rs"
required-features = ["server"]

[[bin]]
name = "alocals3-migrate2pg"
path = "src/bin/alocals3-migrate2pg.rs"
required-features = ["server"]

[dependencies]
anyhow = { version = "1", optional = true }
axum = { version = "0.7", optional = true }
base64 = { version = "0.22", optional = true }
bytes = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"], optional = true }
futures-util = { version = "0.3", optional = true }
http = { version = "1", optional = true }
hmac = { version = "0.12", optional = true }
md5 = "0.7"
mime_guess = "2"
percent-encoding = "2"
pyo3 = { version = "0.29", features = ["abi3-py312"], optional = true }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
sha2 = "0.10"
subtle = { version = "2", optional = true }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "postgres"], optional = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
uuid = { version = "1", features = ["v4"] }

[package.metadata.maturin]
module-name = "alocals3._alocals3_native"
python-source = "."
features = ["extension-module"]

[features]
default = []
extension-module = ["dep:pyo3", "pyo3/extension-module", "dep:pyo3-async-runtimes"]
server = [
    "dep:anyhow",
    "dep:axum",
    "dep:base64",
    "dep:bytes",
    "dep:clap",
    "dep:futures-util",
    "dep:http",
    "dep:hmac",
    "dep:serde",
    "dep:serde_json",
    "dep:sqlx",
    "dep:subtle",
    "dep:tracing",
    "dep:tracing-subscriber",
]
server-binary = []
